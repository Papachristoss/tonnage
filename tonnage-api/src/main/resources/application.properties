spring.application.name=tonnage-api

# 1. Host and Database only (no username or password in the URL itself)
spring.datasource.url=${DB_URL}

# 2. Explicit Username and Password (set these as environment variables, never commit real values)
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 3. PostgreSQL Driver & Hibernate
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Security Configuration (set as an environment variable, never commit the real value)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

#That syntax means: use the CORS_ALLOWED_ORIGINS env var if it's set, otherwise default to http://localhost:5173 for local dev.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}